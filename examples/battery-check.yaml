name: read-battery-level
device: "name:My BLE Device"
timeout: 10
steps:
  - id: inspect
    action: inspect
    expect:
      service_count_at_least: 1

  - id: battery
    action: read
    characteristic: "00002a19-0000-1000-8000-00805f9b34fb"
    requires: [inspect]
    expect:
      min_length: 1

